# MCP_SHARED_SECRET is a secret, not a var -- never put its value here.
#   deployed:  wrangler secret put MCP_SHARED_SECRET
#   local dev: put MCP_SHARED_SECRET=<value> in .dev.vars (gitignored)
# Set it whenever the upstream Honcho runs with AUTH_USE_AUTH=false, because
# this Worker is then the only auth in front of it. Leave it unset to keep the
# old pass-through behaviour where Honcho's own auth rejects bad tokens.

name = "honcho-mcp"
main = "src/index.ts"
compatibility_date = "2024-12-09"
compatibility_flags = ["nodejs_compat"]

# Bundle Markdown (e.g. instructions.md) as text strings so it can be imported.
rules = [
  { type = "Text", globs = ["**/*.md"], fallthrough = true },
]

# Executes the scheduled() handler
[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "46b52984cdf347b5a16441e7945d34bd"

[env.production]
name = "honcho-mcp"

[env.staging]
name = "honcho-mcp-staging"

[observability.logs]
enabled = true
